# =================================================================
# ۱. تنظیمات عمومی و امنیت (General & Security)
# =================================================================

# غیرفعال کردن ورود بدون نام کاربری و رمز عبور
allow_anonymous false

# مسیر فایل پسوردها (باید این فایل رو بسازی و یوزرها رو توش تعریف کنی)
password_file /mosquitto/config/password.txt


# =================================================================
# ۲. پورت معمولی - بدون رمزنگاری (Non-TLS Port)
# =================================================================

# این پورت برای دستگاه‌های داخل شبکه لوکال که نیاز به امنیت ندارند
listener 1883
protocol mqtt


# =================================================================
# ۳. پورت امن - با رمزنگاری (TLS Port)
# =================================================================

# این پورت برای دستگاه‌های سخت‌افزاری (مثل ESP32) در بستر اینترنت
listener 8883
protocol mqtt

# مسیر فایل‌های گواهینامه برای احراز هویت و رمزنگاری TLS
cafile /mosquitto/config/certs/ca.crt
certfile /mosquitto/config/certs/server.crt
keyfile /mosquitto/config/certs/server.key


# =================================================================
# ۴. پورت مخصوص داشبورد وب (Websockets Port)
# =================================================================

# این پورت مخصوص اتصال مرورگرها و داشبوردهای تحت وب است
listener 9001
protocol websockets

# نکته امنیتی: اگر می‌خواهی وب‌سوکت هم امن باشه (WSS)، این ۳ خط زیر رو فعال کن:
# cafile /mosquitto/config/certs/ca.crt
# certfile /mosquitto/config/certs/server.crt
# keyfile /mosquitto/config/certs/server.key